[package]
name = "spinfv1"
version = "0.3.4"
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE"
description = "Spin Semiconductor FV-1 DSP chip emulator: full instruction set, bit-exact S.23 fixed-point core"
repository = "https://github.com/ngriaznov/spinfv1-rs"
keywords = ["fv-1", "dsp", "emulator", "audio", "spin-semiconductor"]
categories = ["emulators", "multimedia::audio"]
readme = "README.md"
# Keep the published crate lean: test fixtures, listening corpus, and
# repository plumbing stay in the repo only.
exclude = ["/tests/data", "/tests/programs", "/examples/programs", "/.githooks", "/.github"]

[package.metadata.docs.rs]
features = ["ffi"]

[features]
default = ["std"]
# Standard library support (kept for compatibility; every module —
# including the assembler, resampler, and C ABI — builds on `core` +
# `alloc` alone, with deterministic pure-arithmetic math and no
# platform libm).
std = []
# Boundary resampling: run the chip at its native 32,768 Hz inside any
# host rate (windowed-sinc polyphase converter + HostedFv1 wrapper).
resampler = []
# C ABI for non-Rust hosts: opaque handle, OS-independent (`no_std` +
# `alloc` backed by C `malloc`/`free`, so the static archive links no
# `libstd` or OS-version-specific syscalls). Build the archive with:
#   cargo rustc --release --features ffi --crate-type staticlib
ffi = ["resampler"]
# Marker feature for `no_std` builds (kept for compatibility):
# build with `--no-default-features` (or `--no-default-features --features libm`).
libm = []

[dependencies]

[[bench]]
name = "throughput"
harness = false

[profile.release]
panic = "abort"
lto = true

[profile.test]
opt-level = 2

[[example]]
name = "process_48k"
required-features = ["std"]

[[example]]
name = "render_corpus"
required-features = ["std"]
