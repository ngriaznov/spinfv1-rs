[package]
name = "spinfv1"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Spin Semiconductor FV-1 DSP chip emulator: full instruction set, bit-exact S.23 fixed-point core"
repository = "https://github.com/ngriaznov/spinfv1-rs"
keywords = ["fv-1", "dsp", "emulator", "audio", "spin-semiconductor"]
categories = ["emulators", "multimedia::audio"]

[features]
default = ["std"]
# Use the host's libm via std's f64 methods (log2/exp2/round). Enabled by
# default; disable with `--no-default-features` for a `no_std` build.
std = []
# Pure-Rust libm implementations of the same operations, for `no_std`
# targets: build with `--no-default-features --features libm`.
libm = ["dep:libm"]

[dependencies]
libm = { version = "0.2", optional = true, default-features = false }

[[bench]]
name = "throughput"
harness = false

[profile.test]
opt-level = 2

[[example]]
name = "process_48k"
required-features = ["std"]

[[example]]
name = "render_corpus"
required-features = ["std"]
