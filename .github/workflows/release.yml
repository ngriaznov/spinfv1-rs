name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0); tags v<version> at the current commit"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  sdk:
    name: C SDK (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib: libspinfv1.a
          - os: macos-latest
            target: aarch64-apple-darwin
            lib: libspinfv1.a
          - os: macos-latest
            target: x86_64-apple-darwin
            lib: libspinfv1.a
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            lib: spinfv1.lib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build static library
        run: cargo rustc --release --features ffi --crate-type staticlib --target ${{ matrix.target }}
      - name: Assemble SDK bundle
        shell: bash
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          NAME="spinfv1-${TAG}-${{ matrix.target }}"
          mkdir -p "$NAME/lib" "$NAME/include"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" "$NAME/lib/"
          cp include/spinfv1.h "$NAME/include/"
          cp README.md LICENSE "$NAME/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$NAME.zip" "$NAME"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: |
            spinfv1-*.tar.gz
            spinfv1-*.zip

  crate:
    name: Source crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Package crate
        run: |
          cargo package --features ffi
          cp target/package/spinfv1-*.crate .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          files: spinfv1-*.crate
          generate_release_notes: true
